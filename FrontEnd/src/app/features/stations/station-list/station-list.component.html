<app-navbar></app-navbar>

<div class="pt-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 min-h-screen">
  
  <!-- Header Title & Action -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-2xl font-bold text-on-surface flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-3xl">location_on</span>
        <span>إدارة المحطات</span>
      </h1>
      <p class="text-xs text-on-surface-variant mt-1">عرض وتتبع جميع محطات وسائط النقل وإحداثيات الموقع التفاعلية.</p>
    </div>

    <button class="px-4 py-2.5 rounded-xl bg-primary hover:bg-primary-hover text-white font-bold text-sm shadow-md shadow-primary/20 transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">add_location_alt</span>
      <span>إضافة محطة جديدة</span>
    </button>
  </div>

  <!-- Search & Filter Controls -->
  <div class="bg-surface-container-lowest rounded-2xl p-4 border border-border-subtle mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="relative w-full md:w-96">
      <span class="material-symbols-outlined text-on-surface-variant absolute right-3.5 top-1/2 -translate-y-1/2 text-xl">search</span>
      <input type="text" placeholder="ابحث باسم المحطة أو المدينة..." class="w-full bg-surface-container-low border border-border-subtle rounded-xl pr-10 pl-4 py-2 text-sm text-on-surface focus:bg-white transition-all" />
    </div>

    <div class="flex items-center gap-3 w-full md:w-auto">
      <select class="bg-surface-container-low border border-border-subtle rounded-xl px-3.5 py-2 text-xs font-medium text-on-surface">
        <option value="">جميع المدن</option>
        <option value="cairo">القاهرة</option>
        <option value="alex">الإسكندرية</option>
        <option value="sinai">جنوب سيناء</option>
        <option value="luxor">الأقصر</option>
      </select>

      <span class="text-xs text-on-surface-variant font-medium">إجمالي: <strong class="font-inter text-primary">12</strong> محطة</span>
    </div>
  </div>

  <!-- Stations Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    
    <!-- Station Card 1 -->
    <div class="bg-surface-container-lowest rounded-2xl p-5 border border-border-subtle hover:border-primary/40 hover:shadow-md transition-all">
      <div class="flex items-start justify-between mb-4">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-primary/10 text-primary flex items-center justify-center font-bold">
            <span class="material-symbols-outlined text-2xl">train</span>
          </div>
          <div>
            <h3 class="font-bold text-on-surface text-base">محطة الرمسيس الرئيسية</h3>
            <span class="text-xs font-semibold text-primary">القاهرة</span>
          </div>
        </div>

        <span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-success-bg text-success-green border border-success-green/20">
          نشطة
        </span>
      </div>

      <p class="text-xs text-on-surface-variant mb-4 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-sm">home_pin</span>
        <span>ميدان الرمسيس، وسط البلد، القاهرة</span>
      </p>

      <div class="pt-3 border-t border-border-subtle flex items-center justify-between text-xs">
        <div class="flex items-center gap-1 font-inter text-on-surface-variant font-semibold">
          <span class="material-symbols-outlined text-xs text-primary">pin_drop</span>
          <span>30.0626, 31.2497</span>
        </div>

        <div class="flex items-center gap-1">
          <button class="w-8 h-8 rounded-lg border border-border-subtle text-on-surface-variant hover:text-primary hover:bg-surface-container flex items-center justify-center transition-colors">
            <span class="material-symbols-outlined text-base">edit</span>
          </button>
          <button class="w-8 h-8 rounded-lg border border-border-subtle text-danger-red hover:bg-danger-bg flex items-center justify-center transition-colors">
            <span class="material-symbols-outlined text-base">delete</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<app-footer></app-footer>
