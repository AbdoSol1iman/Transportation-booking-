<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  
  <!-- Header Title & Action -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-2xl font-bold text-on-surface flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-3xl">group</span>
        <span>إدارة حسابات المستخدمين</span>
      </h1>
      <p class="text-xs text-on-surface-variant mt-1">عرض وتصنيف جميع حسابات الركاب، السائقين، ومديري النظام مع صلاحيات الدخول.</p>
    </div>

    <button class="px-4 py-2.5 rounded-xl bg-primary hover:bg-primary-hover text-white font-bold text-sm shadow-md shadow-primary/20 transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">person_add</span>
      <span>إضافة مستخدم جديد</span>
    </button>
  </div>

  <!-- Users Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    
    <!-- User Card 1 (Admin) -->
    <div class="bg-surface-container-lowest rounded-2xl p-5 border border-border-subtle hover:border-primary/40 hover:shadow-md transition-all">
      <div class="flex items-start justify-between mb-4">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-primary text-white flex items-center justify-center font-bold text-lg shadow-md shadow-primary/20">
            أ م
          </div>
          <div>
            <h3 class="font-bold text-on-surface text-base">المهندس أحمد علي</h3>
            <span class="text-xs font-inter text-on-surface-variant">admin@transport.com</span>
          </div>
        </div>

        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-primary/10 text-primary border border-primary/20 uppercase">
          ADMIN
        </span>
      </div>

      <div class="bg-surface-container-low rounded-xl p-3 text-xs flex items-center justify-between mb-4">
        <span class="text-on-surface-variant">رقم الهاتف:</span>
        <strong class="font-inter text-on-surface dir-ltr">01000000000</strong>
      </div>

      <div class="flex items-center justify-between text-xs pt-2 border-t border-border-subtle">
        <span class="flex items-center gap-1 text-success-green font-semibold">
          <span class="w-2 h-2 rounded-full bg-success-green"></span>
          <span>حساب نشط</span>
        </span>
        <button class="text-on-surface-variant hover:text-primary font-medium">تعديل الصلاحيات</button>
      </div>
    </div>

    <!-- User Card 2 (Passenger) -->
    <div class="bg-surface-container-lowest rounded-2xl p-5 border border-border-subtle hover:border-primary/40 hover:shadow-md transition-all">
      <div class="flex items-start justify-between mb-4">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-surface-container text-on-surface flex items-center justify-center font-bold text-lg border border-border-subtle">
            م م
          </div>
          <div>
            <h3 class="font-bold text-on-surface text-base">منى محمود</h3>
            <span class="text-xs font-inter text-on-surface-variant">mona@example.com</span>
          </div>
        </div>

        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-surface-container text-on-surface-variant border border-border-subtle uppercase">
          PASSENGER
        </span>
      </div>

      <div class="bg-surface-container-low rounded-xl p-3 text-xs flex items-center justify-between mb-4">
        <span class="text-on-surface-variant">رقم الهاتف:</span>
        <strong class="font-inter text-on-surface dir-ltr">01234567890</strong>
      </div>

      <div class="flex items-center justify-between text-xs pt-2 border-t border-border-subtle">
        <span class="flex items-center gap-1 text-success-green font-semibold">
          <span class="w-2 h-2 rounded-full bg-success-green"></span>
          <span>حساب نشط</span>
        </span>
        <button class="text-on-surface-variant hover:text-primary font-medium">عرض الحجوزات</button>
      </div>
    </div>

  </div>
</div>
