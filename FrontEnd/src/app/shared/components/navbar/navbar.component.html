<header class="fixed top-0 w-full z-50 nav-blur bg-surface/60 border-b border-primary/20 glow-primary">
  <div class="h-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
    
    <!-- Logo & Brand -->
    <div class="flex items-center gap-4">
      <a routerLink="/" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-xl shadow-[0_0_15px_rgba(79,70,229,0.4)]">
          <span class="material-symbols-outlined text-2xl">directions_bus</span>
        </div>
        <span class="font-cairo font-extrabold text-2xl tracking-tight text-on-surface">رود<span class="text-secondary">بوكينج</span></span>
      </a>
    </div>

    <!-- Arabic Navigation Links -->
    <nav class="hidden md:flex items-center gap-6 text-sm font-cairo font-bold">
      <a routerLink="/" routerLinkActive="text-primary font-extrabold" [routerLinkActiveOptions]="{exact: true}" class="text-on-surface-variant hover:text-primary transition-all duration-300 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-lg">home</span>
        <span>الرئيسية</span>
      </a>
      <a routerLink="/trips" routerLinkActive="text-primary font-extrabold" class="text-on-surface-variant hover:text-primary transition-all duration-300 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-lg">explore</span>
        <span>استكشاف الرحلات</span>
      </a>
      <a routerLink="/bookings" routerLinkActive="text-primary font-extrabold" class="text-on-surface-variant hover:text-primary transition-all duration-300 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-lg">confirmation_number</span>
        <span>حجوزاتي</span>
      </a>
      <a routerLink="/dashboard" routerLinkActive="text-primary font-extrabold" class="text-on-surface-variant hover:text-primary transition-all duration-300 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-lg">dashboard</span>
        <span>لوحة التحكم</span>
      </a>
      <a routerLink="/stations" routerLinkActive="text-primary font-extrabold" class="text-on-surface-variant hover:text-primary transition-all duration-300 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-lg">location_on</span>
        <span>المحطات</span>
      </a>
      <a routerLink="/vehicles" routerLinkActive="text-primary font-extrabold" class="text-on-surface-variant hover:text-primary transition-all duration-300 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-lg">directions_bus</span>
        <span>الأسطول</span>
      </a>
      <a routerLink="/users" routerLinkActive="text-primary font-extrabold" class="text-on-surface-variant hover:text-primary transition-all duration-300 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-lg">group</span>
        <span>المستخدمين</span>
      </a>
    </nav>

    <!-- Right Actions & Profile -->
    <div class="flex items-center gap-4">
      <a routerLink="/trips" class="hidden lg:block bg-primary-container text-on-primary-container px-6 py-2.5 rounded-full font-cairo text-sm font-bold hover:bg-primary transition-colors shadow-[0_0_15px_rgba(79,70,229,0.3)]">
        احجز رحلتك الآن
      </a>

      <!-- Profile Avatar -->
      <a routerLink="/login" class="p-0.5 rounded-full bg-gradient-to-tr from-primary to-secondary glow-primary inline-block">
        <img alt="Profile" class="w-9 h-9 rounded-full object-cover border-2 border-surface" src="https://lh3.googleusercontent.com/aida/AP1WRLuK80cwmPxlmh4TILDQ0yNKNwB-7IFfW6u_VV2R_-FoPHstR4uXdnKuUuHuesz89IUPqizOwmei5XP1QpjNBvBNAf2JrKKi5CA--qrsDknE3KPQKEKZRBArxECGxzDuqAOTzCIBuxYn_q1Uimqbt49f8EnpkyMTRp8uBFwDNaVN1s5_ywy7PqNeab_sfOuGXIYXVsnMQCgXGGwSlAuWlY9WWtavWkL4MDzc73Q8DYDYOFMGxjZNnrF9KQo" />
      </a>
    </div>

  </div>
</header>
